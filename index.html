<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>키워드 추천 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem 1.5rem 3rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #monthLabel {
      margin-top: 0.4rem;
      opacity: 0.9;
      font-size: 1rem;
    }

    #counter {
      display: inline-block;
      margin-top: 0.8rem;
      background: rgba(255,255,255,0.2);
      padding: 0.25rem 0.9rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* ── Layout ── */
    .container {
      max-width: 1020px;
      margin: -1.5rem auto 2rem;
      padding: 0 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    /* ── Keyword Card ── */
    .keyword-card {
      background: white;
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.28s;
      user-select: none;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .exclude-btn {
      font-size: 11px;
      padding: 3px 8px;
      border: 1px solid #fca5a5;
      background: #fef2f2;
      color: #ef4444;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .exclude-btn:hover {
      background: #ef4444;
      color: white;
    }

    .keyword-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.11);
    }

    .keyword-card.card-out {
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
    }

    .keyword-card.card-in {
      opacity: 0;
      transform: scale(0.88);
      transition: none;
    }

    /* ── Card internals ── */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .rank {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .priority-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: white;
      padding: 0.22rem 0.65rem;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    .keyword-name {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: #1e293b;
      word-break: keep-all;
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    .stat-label { color: #94a3b8; }

    .stat-value {
      font-weight: 700;
      color: #334155;
    }

    .stat-value.stat-up   { color: #16a34a; }
    .stat-value.stat-down { color: #dc2626; }

    .card-hint {
      margin-top: 1rem;
      font-size: 0.72rem;
      color: #cbd5e1;
      text-align: center;
    }

    /* ── States ── */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #eee;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #fff3f3;
      border: 1px solid #fca5a5;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      color: #dc2626;
      margin: 2rem 0;
      line-height: 1.7;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem;
      color: #aaa;
      font-size: 0.82rem;
    }

    /* ── Priority legend ── */
    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.2rem;
      margin: 1.2rem 0 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: #fff;
      opacity: 0.85;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      header h1 { font-size: 1.4rem; }
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>키워드 추천 대시보드</h1>
  <p id="monthLabel">—</p>
  <div id="counter">—</div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#ef4444"></div>긴급
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#f97316"></div>신규수급필요
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#ca8a04"></div>필요
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#22c55e"></div>여유
    </div>
  </div>
</header>

<div class="container">
  <div id="calendarRoot"></div>
</div>

<footer>
  키워드를 클릭하면 제거되고 다음 순위 키워드로 자동 교체됩니다.
</footer>

<script src="script.js"></script>
</body>
</html>
