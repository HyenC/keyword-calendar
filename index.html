<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월별 키워드 캘린더</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem 1.5rem 3rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 0.5rem;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    .year-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .year-nav button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .year-nav button:hover { background: rgba(255,255,255,0.35); }

    .year-nav span {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .container {
      max-width: 1100px;
      margin: -1.5rem auto 2rem;
      padding: 0 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .month-card {
      background: white;
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .month-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .month-card.current-month {
      border: 2px solid #667eea;
    }

    .month-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1rem;
    }

    .month-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .month-name {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .month-sub {
      font-size: 0.78rem;
      color: #888;
      margin-top: 1px;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .keyword-tag {
      background: #f0f0f8;
      color: #444;
      font-size: 0.82rem;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .keyword-tag:hover {
      background: #e0e0f5;
    }

    .keyword-tag.primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .no-keywords {
      color: #bbb;
      font-size: 0.85rem;
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #eee;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #fff3f3;
      border: 1px solid #fcc;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      color: #c00;
      margin: 2rem 0;
    }

    .setup-banner {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      color: #92400e;
      line-height: 1.6;
    }

    .setup-banner strong { font-weight: 700; }

    footer {
      text-align: center;
      padding: 2rem;
      color: #aaa;
      font-size: 0.82rem;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>월별 키워드 캘린더</h1>
  <p>매월 추천 키워드를 확인하세요</p>
  <div class="year-nav">
    <button id="prevYear" title="이전 연도">&#8249;</button>
    <span id="yearLabel">2026</span>
    <button id="nextYear" title="다음 연도">&#8250;</button>
  </div>
</header>

<div class="container">
  <div id="setupBanner" class="setup-banner" style="display:none">
    <strong>⚙️ 설정 안내:</strong>
    <code>script.js</code>의 <code>SHEET_CSV_URL</code>에 Google Sheets 공개 CSV URL을 입력하세요.
    <a href="SETUP.md" target="_blank">설정 방법 보기 &rarr;</a>
  </div>

  <div id="calendarRoot"></div>
</div>

<footer>
  월별 키워드 캘린더 &mdash; 관리자는 Google Sheets에서 키워드를 업데이트하세요.
</footer>

<script src="script.js"></script>
</body>
</html>
